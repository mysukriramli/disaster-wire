name: Autonomous Disaster Intelligence Cron

on:
  schedule:
    # Runs at minute 0 past every 4th hour (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Feeds and Publish Endpoints
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          python ingest_and_publish.py

      - name: Commit and push updated datasets and historical archives
        run: |
          git config user.name "disaster-wire-bot[bot]"
          git config user.email "disaster-wire-bot@users.noreply.github.com"
          
          # Stage the entire data/ directory safely regardless of what was generated
          git add -A data/
          
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(wire): ingest, publish endpoints, and archive history [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
